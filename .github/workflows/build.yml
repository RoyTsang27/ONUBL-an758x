name: Build AN758x U-Boot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - hg5382a
          - hg5585f-ct
          - hg5585f-cu
          - xg2010g
          - xr1710g
          - zn504xg-d
          - zn515xg-d
          - ung00a
          - xg-040g-md
          - xg-040g-tf
          - xg-040g-mf
          - xg-140g-tf
          - xg-140g-tf-s
          - hm2004-du

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison ca-certificates curl device-tree-compiler flex \
            gcc-aarch64-linux-gnu gcc-arm-none-eabi libssl-dev \
            python3 python3-pyelftools swig

      - name: Download Mbed TLS
        run: |
          curl -fL --retry 3 -o mbedtls.tar.bz2 https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2
          printf '%s  %s\n' 'a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6' 'mbedtls.tar.bz2' | sha256sum -c -
          mkdir mbedtls-3.6.7
          tar -xjf mbedtls.tar.bz2 --strip-components=1 -C mbedtls-3.6.7
          echo "MBEDTLS_DIR=$PWD/mbedtls-3.6.7" >> "$GITHUB_ENV"

      - name: Check recovery compatibility and persistent boot storage
        run: |
          sh -n scripts/build-an758x.sh scripts/sign-an758x-fip.sh
          status=0
          python3 test/airoha/ubi_compat.py > regression.log 2>&1 || status=$?
          python3 test/airoha/persistent_boot.py >> regression.log 2>&1 || status=$?
          python3 test/airoha/cve_regressions.py >> regression.log 2>&1 || status=$?
          python3 test/airoha/recovery_security.py >> regression.log 2>&1 || status=$?
          cat regression.log
          printf '### Recovery and persistence checks\n\n~~~text\n' >> "$GITHUB_STEP_SUMMARY"
          cat regression.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n~~~\n' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Build ${{ matrix.target }}
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
          ARM32_CROSS_COMPILE: arm-none-eabi-
          BUILD_JOBS: 4
          AIROHA_SIGN_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.AIROHA_SIGN_KEY || '' }}
          AIROHA_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
        run: sh ./scripts/build-an758x.sh "${{ matrix.target }}" 2>&1 | tee build.log

      - name: Record build result
        if: always()
        run: |
          printf '### Device build result\n\n~~~text\n' >> "$GITHUB_STEP_SUMMARY"
          test ! -f build.log || tail -n 80 build.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n~~~\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Check compiled XG-140G board identity
        run: |
          python3 test/airoha/xg140g_board.py "${{ matrix.target }}" | tee board-check.log
          cat board-check.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: an758x-${{ matrix.target }}
          path: output/${{ matrix.target }}/an75*
          if-no-files-found: error

  source:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply validation source when present
        run: |
          if test -f uboot-v2026.10-source.patch.gz; then
            printf '%s  %s\n' 'abd00eaad506546c90ba03dc28d3322d34af7e9cb34b7c116d6b309ab09edf65' 'uboot-v2026.10-source.patch.gz' | sha256sum -c -
            gzip -dc uboot-v2026.10-source.patch.gz > "$RUNNER_TEMP/source.patch"
            git apply --check "$RUNNER_TEMP/source.patch"
            git apply "$RUNNER_TEMP/source.patch"
          fi
          grep -q '^PATCHLEVEL = 10$' Makefile
      - name: Package source, replacement files and complete patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, subprocess, zipfile
          workflow = Path('.github/workflows/build.yml')
          text = workflow.read_text()
          marker = '      - name: Apply pinned v2026.10 source for validation\n'
          if marker in text:
              start = text.index(marker)
              stop = text.index('      - name: Install build tools\n', start)
              workflow.write_text(text[:start] + text[stop:])
          payload = Path('uboot-v2026.10-source.patch.gz')
          if payload.exists():
              payload.unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          baseline = '23231c9a54f24340101280b1d86dbe14a6c2cd95'
          def git(*args):
              return subprocess.check_output(['git', *args])
          files = git('ls-files', '-z').decode().split('\0')[:-1]
          assert 'test/airoha/ubi_compat.py' in files
          assert 'test/airoha/persistent_boot.py' in files
          assert 'docs/PERSISTENT-BOOT.md' in files
          output = Path('deliverables')
          output.mkdir()
          (output / 'ONUBL-v2026.10.patch').write_bytes(git('diff', '--cached', '--binary', baseline))
          deleted = git('diff', '--cached', '--name-only', '--diff-filter=D', baseline).decode()
          (output / 'deleted-paths.txt').write_text(deleted)
          security_base = 'a0c8ee0615d94d4fe407d607cee2cf8496e41d0c'
          (output / 'ONUBL-CVE-2026-10-17.patch').write_bytes(
              git('diff', '--cached', '--binary', security_base))
          security_files = git('diff', '--cached', '--name-only', '--diff-filter=ACMRTUXB',
                               '-z', security_base).decode().split('\0')[:-1]
          for name in security_files:
              destination = output / 'security-replacement-files' / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, destination)
          subprocess.run(['git', 'apply', '--reverse', '--check',
                          str(output / 'ONUBL-CVE-2026-10-17.patch')], check=True)
          with zipfile.ZipFile(output / 'ONUBL-CVE-2026-10-17-replacements.zip',
                               'w', zipfile.ZIP_DEFLATED) as archive:
              for name in security_files:
                  archive.write(name, name)
          changed = git('diff', '--cached', '--name-only', '--diff-filter=ACMRTUXB', '-z', baseline).decode().split('\0')[:-1]
          for name in changed:
              destination = output / 'replacement-files' / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, destination)
          with zipfile.ZipFile(output / 'ONUBL-v2026.10-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  if Path(name).is_file():
                      archive.write(name, name)
          review_base = '82e2595b6d0f6e5343e066809f494e09bc114b40'
          review_patch = output / 'ONUBL-2026-10-21.patch'
          review_patch.write_bytes(git('diff', '--cached', '--binary', review_base))
          review_files = git('diff', '--cached', '--name-only', '--diff-filter=ACMRTUXB',
                             '-z', review_base).decode().split('\0')[:-1]
          with zipfile.ZipFile(output / 'ONUBL-2026-10-21-replacements.zip',
                               'w', zipfile.ZIP_DEFLATED) as archive:
              for name in review_files:
                  archive.write(name, name)
                  destination = output / '2026-10-21-replacement-files' / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(name, destination)
          subprocess.run(['git', 'apply', '--reverse', '--check', str(review_patch)], check=True)
          manifest = {'baseline': baseline,
                      'security_baseline': security_base,
                      'security_review_date': '2026-10-21',
                      'review_baseline': review_base,
                      'review_changed_files': review_files,
                      'upstream': '5508406582f6f7120dce0c4b3059819a41788db2',
                      'validated_commit': git('rev-parse', 'HEAD').decode().strip(),
                      'source_tree': git('write-tree').decode().strip(),
                      'changed_files': len(changed),
                      'sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                                 for p in output.iterdir() if p.is_file()}}
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ONUBL-v2026.10-source-and-replacements
          path: deliverables/
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: an758x-*
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/* --generate-notes
          --repo "$GITHUB_REPOSITORY"
